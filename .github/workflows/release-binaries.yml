name: Build Multi-OS Release Assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller setproctitle
          if (Test-Path ".\requirements.txt") { python -m pip install -r .\requirements.txt }
      - name: Build Windows app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --windowed --onedir --name "KomaStage" --add-data "assets;assets" main.py
      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path ".\dist\KomaStage" -DestinationPath ".\KomaStage-Windows.zip" -Force
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KomaStage-Windows
          path: KomaStage-Windows.zip
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          files: KomaStage-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system Qt & build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libgl1
          python -m pip install --upgrade pip
          python -m pip install pyinstaller setproctitle
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Build Linux app
        run: |
          python -m PyInstaller --noconfirm --windowed --onedir --name "KomaStage" --add-data "assets:assets" main.py
      - name: Archive Linux build
        run: |
          tar -czf KomaStage-Linux.tar.gz -C dist KomaStage
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KomaStage-Linux
          path: KomaStage-Linux.tar.gz
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          files: KomaStage-Linux.tar.gz
