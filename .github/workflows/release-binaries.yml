name: Build Multi-OS Release Assets

on:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pyinstaller setproctitle
          if exist requirements.txt pip install -r requirements.txt
      - name: Build Windows app
        run: pyinstaller --noconfirm --windowed --onedir --name "KomaStage" --add-data "assets;assets" main.py
      - name: Zip Windows build
        run: Compress-Archive -Path "dist\KomaStage" -DestinationPath "KomaStage-Windows.zip" -Force
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: KomaStage-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system Qt & build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libgl1
          pip install pyinstaller setproctitle
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Build Linux app
        run: pyinstaller --noconfirm --windowed --onedir --name "KomaStage" --add-data "assets:assets" main.py
      - name: Archive Linux build
        run: tar -czf KomaStage-Linux.tar.gz -C dist KomaStage
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: KomaStage-Linux.tar.gz
